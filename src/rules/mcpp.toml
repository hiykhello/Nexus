[package]
name = "policy"
version = "0.1.0"

# Configuration and rule-file parsing share the rule model and its Glaze
# adapter; this member owns those modules independently of the proxy runtime.
[dependencies]
nexus.glaze-kdl = "=0.1.1"
containers = { path = "../containers" }
functional = { path = "../functional" }
utility = { path = "../utility" }
encoding = { path = "../encoding" }
platform = { path = "../platform" }

[features]
dns-response = { defines = ["NEXUS_DNS_RESPONSE"] }
srs = { sources = ["srs_file.cppm", "srs_input_enabled.cpp", "!srs_input_disabled.cpp"] }

[feature-deps.srs]
zlib-system = { path = "../../3rdparty/mcpp-zlib" }

[build]
sources = [
    "../http/header.cppm", "../http/connect.cppm", "../http/connect.cpp", "../http/forward.cpp", "../http/request.cpp", "../http/chunk.cpp", "../http/response.cpp",
    "../quic/receive_windows.cppm", "../transport/xhttp/config.cppm", "../transport/xhttp/wire.cppm", "../config/xhttp.cpp",
    "../../3rdparty/modules/glaze.cppm",
    "../provider/types.cppm", "../provider/detail.cppm", "../provider/provider.cppm", "../provider/uri_parser.cpp", "../provider/yaml_dom.cpp", "../provider/clash_yaml.cpp", "../provider/singbox_json.cpp", "../provider/kdl_emit.cpp", "../provider/kdl_expand.cpp",
    "../provider/workspace_types.cppm", "../provider/workspace_detail.cppm", "../provider/workspace_compose.cppm", "../provider/workspace_emit.cpp", "../provider/workspace_host.cpp", "../provider/workspace_route_dns.cpp", "../provider/workspace_compose.cpp",
    "../logging/options.cppm", "../config/logging.cpp", "../config/kdl_common.cppm", "../config/service_types.cppm", "../config/provider_types.cppm", "../config/extra_types.cppm", "../config/dns_extra_types.cppm", "../config/group_types.cppm", "../config/config.cppm", "../config/desugar.cppm", "../config/rule_set_parse.cppm", "../config/dns_predefined.cppm", "../config/routing.cppm", "../config/config.cpp", "../config/providers.cpp", "../config/shadowsocks.cpp", "../config/inbound.cpp", "../config/user_limits.cpp", "../config/http_clients.cpp", "../config/state_options.cpp", "../config/extra_parse.cpp", "../config/groups.cpp", "../config/reload.cpp", "../config/vless_outbound.cpp", "../config/dns.cpp", "../config/dns_fakeip.cpp", "../config/dns_rule.cpp", "../config/dial.cpp", "../config/dependencies.cpp", "../config/trojan.cpp", "../config/anytls.cpp", "../config/hysteria2.cpp", "../config/snell.cpp", "../config/tcp_proxy.cpp", "../config/masque.cpp", "../config/httpupgrade.cpp", "../config/grpc.cpp", "../config/mux.cpp", "../config/tun.cpp", "../config/wireguard.cpp", "../config/ssh.cpp", "../config/naive.cpp", "../config/vpn.cpp", "../config/protocols_ext.cpp", "../config/services.cpp",
    "types.cppm", "rules.cppm", "mmap_ruleset.cppm", "mmap_ruleset.cpp", "rule_input.cppm", "rule_input.cpp", "convert_external.cppm", "convert_json.cpp", "convert_text.cpp", "srs_input_disabled.cpp", "srs_domain.cppm", "srs_payload.cppm", "domain_pattern.cppm", "regex.cppm", "any_index.cppm", "dns_policy_types.cppm", "dns_policy.cppm", "validate.cpp", "kdl.cpp", "kdl_predicate.cppm", "references.cpp", "beve.cpp", "beve_profile.cpp", "matcher.cpp", "matcher_eval.cpp", "route_matcher.cpp", "program.cpp",
    "../rulefile/rulefile.cppm",
]

[target.'cfg(not(os = "windows"))'.build]
sources = ["../rulefile/posix.cpp"]

[target.'cfg(os = "windows")'.build]
sources = ["../rulefile/windows.cpp"]
