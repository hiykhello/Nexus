[package]
name = "dns-group-udp"
version = "0.1.0"

# Compile-time adapters connect the shared cache to the SS UDP runtime.
[dependencies]
dns-group-core = { path = "../dns-shared" }
ss-udp-runtime = { path = "../udp-runtime", default-features = false }
relay-runtime = { path = "../relay", default-features = false }

[features]
default = ["standard-proxy"]
dns-response = { implies = ["relay-runtime/dns-response", "ss-udp-runtime/dns-response", "dns-group-core/dns-response"], defines = ["NEXUS_DNS_RESPONSE"] }
standard-proxy = ["relay-runtime/dns-standard", "relay-runtime/request-standard"]

[build]
sources = ["udp_group.cppm", "udp_coordinator.cppm"]
