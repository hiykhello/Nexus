[package]
namespace = "nexus"
name = "tun"
version = "0.1.0"

# Packet codecs, the userspace TCP/UDP stacks, and their Linux TUN driver
# share one transport lifecycle. Policy is owned by the common rules member.
[dependencies]
nexus.policy = { path = "../rules" }
nexus.platform = { path = "../platform" }

[features]
network = { implies = ["nexus.platform/netlink"], sources = [
    "../packet/tun_network_types.cppm", "../packet/tun_network_records.cppm",
    "../packet/tun_network_requests.cppm", "../packet/tun_network_view.cppm", "../packet/tun_network.cppm",
] }

default-network = { implies = ["network", "nexus.platform/netlink-policy"], sources = ["../packet/tun_default_policy.cppm"] }

[build]
sources = [
    "../packet/fd.cpp", "../packet/fd.cppm", "../packet/icmp.cpp", "../packet/ipv4.cpp", "../packet/ipv6.cpp", "../packet/memory.cpp", "../packet/packet.cppm", "../packet/switch.cpp", "../packet/switch.cppm", "../packet/tcp4.cpp", "../packet/tcp6.cpp", "../packet/tun_linux.cpp", "../packet/tun_linux.cppm",
    "../tcp/*.cppm", "../tcp/*.cpp",
    "../udp/*.cppm", "../udp/*.cpp",
    "*.cppm", "*.cpp",
]
