[package]
name = "wireguard-endpoint"
version = "0.1.0"

# Control-plane construction is separate from reusable protocol/packet cores.
[dependencies]
protocols = { path = "..", features = ["wireguard-tun"] }
tun = { path = "../tun", features = ["network", "default-network"] }
dns = { path = "../dns" }
policy = { path = "../rules" }
encoding = { path = "../encoding" }

[features]
host-dns-resolved = []

[build]
sources = [
    "config.cppm", "config.cpp", "config_addresses.cpp", "credentials.cppm",
    "route_probe.cppm", "host_dns_types.cppm", "resolved_dns.cppm", "owner.cppm", "process_signals.cppm", "on_demand.cppm", "on_demand.cpp", "bootstrap.cppm", "bootstrap.cpp",
]
