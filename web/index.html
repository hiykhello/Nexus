<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111318" />
    <title>Nexus Console</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #111318;
        color: #edf0f5;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
      }
      @media (pointer: fine) {
        html {
          overscroll-behavior: none;
        }
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='obsidian']):not([data-theme='amber']):not([data-theme='dark']),
        html:not([data-theme='obsidian']):not([data-theme='amber']):not([data-theme='dark']) body {
          background: #f6f5f2;
          color: #181c24;
        }
      }
      html[data-theme='daylight'],
      html[data-theme='daylight'] body,
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f6f5f2;
        color: #181c24;
      }
      html[data-theme='obsidian'],
      html[data-theme='obsidian'] body,
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #111318;
        color: #edf0f5;
      }
      html[data-theme='amber'],
      html[data-theme='amber'] body {
        background: #131210;
        color: #f2eee7;
      }
    </style>
  </head>
  <body>
    <nexus-app></nexus-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
