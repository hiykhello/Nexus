[package]
namespace = "nexus"
name = "tls-tests"
version = "0.1.0"

[dependencies]
nexus.protocols = { path = "../../src", features = ["tls"] }
nexus.capy-source = { workspace = true, patches = ["../../3rdparty/patches/capy/mcpp-exact.patch"] }
nexus.corosio-source = { workspace = true, patches = ["../../3rdparty/patches/corosio/mcpp-exact.patch"] }

[features]
quic-resumption = ["resumption", "nexus.protocols/quic-resumption"]
resumption = ["nexus.protocols/tls-resumption"]
quic-tls = ["nexus.protocols/quic-tls"]
https = { sources = ["../../src/http/corosio_https.cppm"] }
io-uring = ["nexus.corosio-source/uring"]

[feature-deps.io-uring]
nexus.uring-system = { path = "../../3rdparty/mcpp-uring" }

[build]
sources = []

[test]
discover = ["byte_stream_adapter.cpp", "hello_auth.cpp", "pending_verifier.cpp", "server_negotiation.cpp", "client_handshake.cpp"]

[targets.tls-server-flight]
kind = "bin"
main = "../tls_server_flight.cpp"
cxxflags = ["-fno-module-lazy"]

[targets.tls-server-handshake-io]
kind = "bin"
main = "../tls_server_handshake_io.cpp"
cxxflags = ["-fno-module-lazy"]

[targets.tls-server-credential]
kind = "bin"
main = "../tls_server_credential.cpp"
cxxflags = ["-fno-module-lazy"]

[targets.tls-openssl-client]
kind = "bin"
main = "../tls_openssl_client.cpp"
cxxflags = ["-fno-module-lazy"]

[targets.tls-signature-interop]
kind = "bin"
main = "../tls_signature_interop.cpp"
cxxflags = ["-fno-module-lazy"]

[targets.tls-corosio-server]
kind = "bin"
main = "../tls_corosio_server.cpp"
cxxflags = ["-fno-module-lazy"]

[targets.nexus-tls-corosio-openssl-test]
kind = "bin"
main = "../tls_corosio_openssl.cpp"
required_features = ["https"]

# mcpp discovers tests only within this package root. Keep legacy sources in
# place and run these no-argument bins alongside the five discovered tests.
cxxflags = ["-fno-module-lazy"]

[targets.tls-record]
kind = "bin"
main = "../protocol/tls_record.cpp"
cxxflags = ["-fno-module-lazy"]

