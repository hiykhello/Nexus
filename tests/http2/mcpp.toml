[package]
name = "http2-tests"
version = "0.1.0"

# Exercise the real HTTP/2 session independently of the proxy and TLS.
[dependencies]
protocols = { path = "../../src", features = ["http2"] }

[features]
default = ["io-uring"]
io-uring = ["protocols/io-uring"]
tls = ["protocols/http2-tls"]
test-allocator = { implies = ["protocols/test-http2-allocator"], sources = ["http2_allocator_probe.cpp"] }

[build]
sources = []

[test]
discover = ["http2_server.cpp", "http2_server_flow.cpp", "http2_memory_budget.cpp", "nghttp2_memory.cpp", "window.cpp"]

[targets.http2-tls-server]
kind = "bin"
main = "http2_tls_server.cpp"
required_features = ["tls"]

[targets.http2-allocator-boundary]
kind = "bin"
main = "http2_allocator_boundary.cpp"
required_features = ["test-allocator"]

[targets.http2-tls-backpressure]
kind = "bin"
main = "http2_tls_backpressure.cpp"
required_features = ["tls"]
