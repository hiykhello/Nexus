[package]
name = "platform-tests"
version = "0.1.0"

# Reusable test-only fault injection for the platform boundary.
[dependencies]
platform = { path = "../../src/platform" }

[features]
test-random = { implies = ["platform/test-random"], defines = ["NEXUS_TEST_LINUX_RANDOM"] }

[build]
sources = ["random_fault.cppm"]

[targets.platform-test-support]
kind = "lib"

[test]
discover = ["linux_random.cpp"]
