[package]
namespace = "nexus"
name = "thirdparty-tests"
version = "0.1.0"

[dependencies]
# Build the patched pair together, as nexus.protocols does. Corosio consumes
# Capy's headers; separate source-only packages have no sibling include edge.
nexus.capy-source = { workspace = true, patches = ["../../3rdparty/patches/capy/mcpp-exact.patch"], embed = true }
nexus.corosio-source = { workspace = true, patches = ["../../3rdparty/patches/corosio/mcpp-exact.patch"], embed = true }

[features]
default = ["io-uring"]
io-uring = ["nexus.corosio-source/uring"]
cpo = { sources = ["../cpo_module.cppm", "../cpo_header.cpp"] }
allocation = []
alignment = []
crypto = []

[feature-deps.io-uring]
nexus.uring-system.workspace = true

[feature-deps.crypto]
nexus.boringssl-crypto-source = { workspace = true, patches = ["../../3rdparty/patches/boringssl/mcpp-exact.patch"] }

[build]
defines = ["BOOST_CAPY_NO_LIB", "BOOST_CAPY_STATIC_LINK",
           "BOOST_COROSIO_NO_LIB", "BOOST_COROSIO_STATIC_LINK"]
sources = []

[targets.cpo-module]
kind = "bin"
main = "../cpo_module.cpp"
required_features = ["cpo"]

[targets.allocation-probe]
kind = "bin"
main = "../allocation_probe.cpp"
required_features = ["allocation"]

[targets.capy-frame-alignment]
kind = "bin"
main = "frame_alignment.cpp"
required_features = ["alignment"]

[targets.crypto-smoke]
kind = "bin"
main = "../crypto_smoke.cpp"
required_features = ["crypto"]
