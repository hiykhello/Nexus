[package]
name = "ss-udp-owner-fault-tests"
version = "0.1.0"

# Only this graph injects exceptions in DNS receive. The callback lives in
# the owner fixture and is not linked into ordinary SS UDP tests.
[dependencies]
ss-udp-runtime = { path = "../../src/udp-runtime" }
dns = { path = "../../src/dns", features = ["test-dns-lifetime"] }
protocols = { path = "../../src", features = ["ss2022"] }
policy = { path = "../../src/rules" }

[features]
default = ["io-uring"]
io-uring = ["protocols/io-uring"]

[build]
sources = []

[targets.resolve-owner-fault]
kind = "bin"
main = "../udp-runtime/resolve_owner.cpp"
