[package]
namespace = "nexus"
name = "tun-tests"
version = "0.1.0"

# Tests exercise the real transport and share only the deterministic network
# fixture; privileged devices and independent Python drivers are explicit bins.
[dependencies]
nexus.tun = { path = "../../src/transport" }
nexus.platform = { path = "../../src/platform" }
nexus.platform-tests = { path = "../platform" }

[features]
test-random = { implies = ["nexus.platform/test-random"], defines = ["NEXUS_TEST_LINUX_RANDOM"] }

[build]
sources = ["scheduled_link.cppm"]

[targets.tun-test-support]
kind = "lib"

[targets.tcp-watch-bench]
kind = "bin"
main = "../../experiments/tcp-watch/bench.cpp"

[targets.packet-tun-linux]
kind = "bin"
main = "../packet_tun_linux.cpp"

[targets.nexus-packet-tun-helper]
kind = "bin"
main = "../tun_linux_helper.cpp"

[targets.tcp-kernel-tun]
kind = "bin"
main = "../tcp_kernel_tun.cpp"

[targets.transport-tun-linux]
kind = "bin"
main = "../transport_tun_linux.cpp"

[targets.transport-kernel-tun]
kind = "bin"
main = "../transport_kernel_tun.cpp"

[targets.transport-tun-linux-e2e]
kind = "bin"
main = "../transport_tun_linux_e2e.cpp"

[targets.transport-tun-random]
kind = "bin"
main = "../transport_tun_random.cpp"
required_features = ["test-random"]

[test]
discover = [
    "packet.cpp", "packet6.cpp", "packet_icmp.cpp", "packet_fd.cpp", "packet_switch.cpp", "packet_switch_allocation.cpp",
    "tcp_packet.cpp", "tcp_receive.cpp", "tcp_send.cpp", "tcp_send_allocation.cpp", "tcp_memory.cpp", "tcp_handshake.cpp",
    "tcp_connection.cpp", "tcp_persist_memory.cpp", "tcp_table.cpp", "tcp_watch_allocation.cpp", "tcp_dispatch.cpp",
    "tcp_stateless_reset_allocation.cpp", "tcp_engine.cpp", "tcp_engine_reorder.cpp", "tcp_service.cpp", "tcp_window.cpp",
    "tcp_reset.cpp", "tcp_route.cpp", "tcp_stack_multi.cpp", "tcp_stack.cpp", "tcp_stack6.cpp", "tcp_direct.cpp",
    "tcp_direct6.cpp", "tcp_direct_packets.cpp", "tcp_reset_allocation.cpp", "tcp_stack_input_allocation.cpp",
    "tcp_input_allocation.cpp", "tcp_read_allocation.cpp", "tcp_open_allocation.cpp",
    "udp.cpp", "udp_loopback.cpp", "udp_route.cpp", "udp_direct.cpp", "udp_direct6.cpp", "udp_engine.cpp",
    "udp_direct_many.cpp", "udp_input_allocation.cpp", "transport_fd.cpp", "transport_dual_direct.cpp",
    "transport_dual_tcp.cpp", "transport_memory.cpp", "transport_stale_reset.cpp",
]
