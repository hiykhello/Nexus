[package]
namespace = "nexus"
name = "dns-group-integration"
version = "0.1.0"

# Real TCP + SS UDP integration fixtures select their test dependencies explicitly.
[features]
joint = []
coordinator = ["joint", "nexus.proxy-runtime/test-dns-group"]
standard-proxy = ["coordinator", "nexus.proxy-runtime/request-standard"]
fakeip-proxy = { implies = ["coordinator", "nexus.proxy-runtime/test-fakeip"], sources = ["fakeip_hooks.cpp"] }
group-proxy = ["joint", "nexus.proxy-runtime/request-standard"]
refresh-proxy = ["joint", "nexus.proxy-runtime/request-standard", "nexus.proxy-runtime/test-dns-group-refresh"]
refresh-start-fault = ["joint", "nexus.proxy-runtime/request-standard", "nexus.proxy-runtime/test-dns-group-start-fault"]
protocols = ["joint", "nexus.proxy-runtime/vless", "nexus.proxy-runtime/ss2022", "nexus.protocols/vless"]
capacity-group = []
capacity-baseline = []
standard-lifetime = []
standard-owner = []
io-uring = ["nexus.corosio-source/uring"]

[feature-deps.joint]
nexus.dns-group-core = { path = "../../../src/dns-shared" }
nexus.dns-group-udp = { path = "../../../src/udp-shared", default-features = false }
nexus.ss-udp-runtime = { path = "../../../src/udp-runtime", default-features = false }
nexus.proxy-runtime = { path = "../../../src/proxy", default-features = false, features = ["test-dns-group-base", "test-dns-shared-access"] }
nexus.policy = { path = "../../../src/rules" }
nexus.protocols = { path = "../../../src", features = ["ss2022"] }
nexus.capy-source = { workspace = true, patches = ["../../../3rdparty/patches/capy/mcpp-exact.patch"] }
nexus.corosio-source = { workspace = true, patches = ["../../../3rdparty/patches/corosio/mcpp-exact.patch"] }

[feature-deps.capacity-group]
nexus.proxy-runtime = { path = "../../../src/proxy", default-features = false, features = ["test-dns-group-base", "request-standard"] }

[feature-deps.capacity-baseline]
nexus.proxy-runtime = { path = "../../../src/proxy" }

# The ordinary-cache owner has a different abandonment contract from the
# shared coordinator; keep these existing fault fixtures in their own graph.
[feature-deps.standard-lifetime]
nexus.proxy-runtime = { path = "../../../src/proxy", default-features = false, features = ["dns-standard", "request-standard", "test-dns-lifetime"] }

[feature-deps.standard-owner]
nexus.proxy-runtime = { path = "../../../src/proxy", default-features = false, features = ["dns-standard", "request-standard", "test-dns-owner"] }

[feature-deps.io-uring]
nexus.uring-system.workspace = true
nexus.corosio-source = { workspace = true, patches = ["../../../3rdparty/patches/corosio/mcpp-exact.patch"] }

[targets.joint-coordinator-fixture]
kind = "bin"
main = "joint_coordinator_fixture.cpp"
required_features = ["coordinator"]

[targets.coordinator-isolation-fixture]
kind = "bin"
main = "../proxy_coordinator_isolation_fixture.cpp"
required_features = ["coordinator"]

[targets.joint-feature-api]
kind = "bin"
main = "../../../tests/proxy_feature_api.cpp"
defines = ["NEXUS_TEST_DNS_SHARED_ACCESS"]
required_features = ["coordinator"]

[targets.joint-fakeip-fixture]
kind = "bin"
main = "joint_fakeip_fixture.cpp"
required_features = ["fakeip-proxy"]

[targets.joint-mixed-outbounds]
kind = "bin"
main = "../../../tests/proxy_mixed_outbounds.cpp"
defines = ["NEXUS_TEST_DNS_SHARED_ACCESS"]
required_features = ["coordinator", "protocols"]

[targets.tcp-refresh-start-fault]
kind = "bin"
main = "tcp_refresh_start_fault.cpp"
required_features = ["refresh-start-fault"]

[targets.joint-group-fixture]
kind = "bin"
main = "joint_group_fixture.cpp"
required_features = ["group-proxy"]

[targets.joint-refresh-fixture]
kind = "bin"
main = "joint_group_fixture.cpp"
defines = ["NEXUS_TEST_DNS_GROUP_REFRESH"]
required_features = ["refresh-proxy"]

[targets.capacity-group-fixture]
kind = "bin"
main = "../proxy_shared_capacity_fixture.cpp"
defines = ["NEXUS_TEST_DNS_GROUP"]
required_features = ["capacity-group"]

[targets.capacity-baseline-fixture]
kind = "bin"
main = "../proxy_shared_capacity_fixture.cpp"
required_features = ["capacity-baseline"]

[targets.standard-dns-lifetime]
kind = "bin"
main = "../../../tests/proxy_dns_lifetime.cpp"
required_features = ["standard-lifetime"]

[targets.standard-dns-owner]
kind = "bin"
main = "../../../tests/proxy_dns_owner.cpp"
required_features = ["standard-owner"]

[targets.standard-borrowed-state]
kind = "bin"
main = "../../../tests/proxy_borrowed_state.cpp"
required_features = ["standard-owner"]
