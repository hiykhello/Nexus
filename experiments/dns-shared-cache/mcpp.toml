[package]
namespace = "nexus"
name = "dns-group-experiment"
version = "0.1.0"

# Experimental fixtures exercise the production snapshot and coordination core.
[dependencies]
nexus.dns = { path = "../../src/dns" }
nexus.dns-group-core = { path = "../../src/dns-shared" }
nexus.dns-group-udp = { path = "../../src/udp-shared", default-features = false }
nexus.protocols = { path = "../../src", features = ["ss2022"] }
nexus.ss-udp-runtime = { path = "../../src/udp-runtime", default-features = false }
nexus.proxy-runtime = { path = "../../src/proxy" }
nexus.capy-source = { workspace = true, patches = ["../../3rdparty/patches/capy/mcpp-exact.patch"] }
nexus.corosio-source = { workspace = true, patches = ["../../3rdparty/patches/corosio/mcpp-exact.patch"] }

[features]
default = ["io-uring"]
io-uring = ["nexus.corosio-source/uring"]
test-udp-start = { implies = ["nexus.ss-udp-runtime/test-udp-start"], defines = ["NEXUS_TEST_UDP_START"] }

[feature-deps.io-uring]
nexus.uring-system = { path = "../../3rdparty/mcpp-uring" }

[build]
sources = ["udp_start_hooks.cpp"]
flags = [
    # These differential and allocation-failure tests exercise the production
    # snapshot cache; the selector belongs only to the two test entry points.
    { glob = "semantic_cache_test.cpp", defines = ["DNS_MODULE_SNAPSHOT_EXPERIMENT"] },
    { glob = "semantic_cache_faults.cpp", defines = ["DNS_MODULE_SNAPSHOT_EXPERIMENT"] },
]

[targets.group-udp-fixture]
kind = "bin"
main = "udp_group_fixture.cpp"

[targets.udp-start-fault]
kind = "bin"
main = "udp_start_fault.cpp"
required_features = ["test-udp-start"]

[test]
discover = [
    "group_coordinator_proxy_view_test.cpp",
    "semantic_cache_test.cpp",
    "semantic_cache_faults.cpp",
]
