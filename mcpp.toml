naive = { implies = ["tls", "http2", "quic-tls", "quic-retry", "quic-shared-port", "packet-stream-socket", "masque-server", "protocols/naive", "relay-runtime/naive"], defines = ["NEXUS_ENABLE_NAIVE"] }
test-http-header-fixture = []
