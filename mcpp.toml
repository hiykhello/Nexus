test-hy2-retry-resource = { implies = ["test-hy2-retry-fixture"], sources = ["tests/support/hy2_retry_resource_link.cppm", "tests/support/hy2_retry_resource_link.cpp"] }
quic-shared-port = ["protocols/quic-shared-port"]
