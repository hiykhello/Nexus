# The workspace is being organized by responsibility; only declared features
# and tests are available in the current build graph.
[workspace]
members = ["tests/dns-flight-copy", "src/endpoint", "tests/wireguard-endpoint", "tests/wireguard-reverse-fault", "src", "src/rules", "src/dns", "src/proxy", "src/crypto", "src/platform", "src/transport", "src/udp-runtime", "tests/protocol", "tests/dns", "tests/fakeip", "tests/http2", "tests/http2-client", "tests/tls", "tests/platform", "tests/thirdparty", "tests/proxy-faults", "tests/proxy-preload", "tests/shims/proxy-start", "tests/shims/slow-resolver", "tests/shims/clock-fault", "tests/shims/dns-system-guard", "tests/shims/ss-udp-observe", "tests/tun", "tests/tun-faults", "tests/udp-faults", "tests/udp-runtime", "tests/udp-owner-faults", "tests/uot-client", "tests/chain-client", "src/dns-shared", "src/udp-shared", "experiments/dns-shared-cache/integration", "experiments/dns-shared-cache"]

[workspace.package]
standard = "c++26"
mcpp = ">=2026.11.21.1"

[workspace.dependencies]
nexus.glaze-kdl = "=0.1.0"
nexus.ngcpp-proxy = "=0.1.0"
nexus.capy-source = "=0.2.8"
nexus.corosio-source = "=0.3.12"
nexus.boringssl-crypto-source = "=0.1.2"
nexus.blake3-source = "=1.8.7"
nexus.argon2-source = "=20190702-nexus.2"
nexus.nghttp2-source = "=1.71.0"
nexus.nghttp3-source = "=1.19.0-nexus.1"
nexus.uring-system = { path = "3rdparty/mcpp-uring" }
nexus.zlib-system = { path = "3rdparty/mcpp-zlib" }
nexus.systemd-system = { path = "3rdparty/mcpp-systemd" }

[package]
name = "nexus"
version = "0.1.0"

[workspace.toolchain]
# Managed LLVM 23 toolchain bundles libc++, std.cppm, and static C++ runtime archives.
default = "llvm@23.1.3"

[workspace.target.x86_64-linux-gnu]
sysroot = "glibc@system"

[workspace.indices]
nexus = { path = "3rdparty/mcpp-index" }

[dependencies]
nexus.policy = { path = "src/rules" }
nexus.dns = { path = "src/dns" }
nexus.protocols = { path = "src", features = ["logging", "state"] }
nexus.proxy-runtime = { path = "src/proxy" }
nexus.platform = { path = "src/platform", features = ["network-state"] }
nexus.glaze-kdl = "=0.1.0"
nexus.ngcpp-proxy = "=0.1.0"
nexus.capy-source = { version = "=0.2.8", patches = ["3rdparty/patches/capy/mcpp-exact.patch"] }
nexus.corosio-source = { version = "=0.3.12", patches = ["3rdparty/patches/corosio/mcpp-exact.patch"] }

[features]
default = ["io-uring"]
# Named aggregate release profiles:
# - profile-sidecar: cross-platform non-root core (Android / macOS / iOS / Windows).
# - profile-linux-epoll: full Linux epoll profile (adds kTLS, TPROXY, host DNS, journald).
# - profile-linux-uring: full Linux io_uring profile.
profile-sidecar = [
    "http-connect-tls", "quic-sniff", "dns-https3", "tls-certificate-compression",
    "vless", "xhttp-vless", "tls-resumption", "http-client-h2", "http-client-h3",
    "srs", "anytls", "dns-https", "dns-quic-resumption", "hy2-cli", "tuic",
    "masque-ip-endpoint", "ss2022", "trojan", "dns-fakeip", "dns-response-ss",
    "quic-resumption", "masque-ip-server", "snell", "shadowtls-proxy",
    "grpc-vless", "wireguard-outbound", "ssh", "naive", "control-http", "metrics-openmetrics", "ntp",
]
profile-linux-epoll = [
    "profile-sidecar", "log-journald", "tun-host-dns", "wireguard-host-dns",
    "tproxy-udp", "ktls",
]
profile-linux-uring = ["profile-linux-epoll", "io-uring"]
state-unit = []
state-fakeip-dns-unit = []
ruleset-cache-unit = []
routing-batch93a-unit = []
logging = ["nexus.protocols/logging"]
log-journald = ["nexus.protocols/log-journald"]
ntp = { implies = ["nexus.protocols/ntp"], defines = ["NEXUS_ENABLE_NTP"], sources = ["src/tools/proxy_ntp_enabled.cpp", "!src/tools/proxy_ntp_disabled.cpp"] }
control-http = { implies = ["crypto"], defines = ["NEXUS_ENABLE_CONTROL_HTTP"], sources = ["src/control_api/http_socket.cppm", "src/control_api/http_socket_posix.cpp", "src/control_api/http_socket_windows.cpp", "src/control_api/http_server.cppm", "src/control_api/http_server.cpp", "!src/control_api/control_api_disabled.cppm"] }
metrics-openmetrics = { implies = ["control-http"], defines = ["NEXUS_ENABLE_OPENMETRICS"], sources = ["src/control_api/openmetrics.cppm", "!src/control_api/openmetrics_disabled.cppm"] }
srs = ["nexus.policy/srs"]
tproxy-udp = ["nexus.proxy-runtime/tproxy-udp"]
http-connect-tls = ["tls", "nexus.proxy-runtime/http-connect-tls"]
io-uring = ["nexus.corosio-source/uring", "nexus.platform/io-uring"]
# Crypto can also be selected without the VLESS transport.
crypto = ["crypto-primitives"]
crypto-primitives = []
tls = ["crypto", "nexus.protocols/tls"]
tls-resumption = ["tls", "nexus.protocols/tls-resumption"]
tls-certificate-compression = ["tls", "nexus.protocols/tls-certificate-compression"]
ktls = { implies = ["tls", "nexus.protocols/ktls"], defines = ["NEXUS_ENABLE_KTLS"] }
dns-fakeip = { implies = ["nexus.dns/fakeip-history", "nexus.proxy-runtime/fakeip"], defines = ["NEXUS_ENABLE_FAKEIP"], sources = ["src/tools/dns_fakeip_backend.cppm", "!src/tools/dns_fakeip_backend_disabled.cppm"] }
dns-tls = { implies = ["tls", "nexus.dns/tls-query"], sources = ["src/tools/dns_transports.cpp", "!src/tools/dns_transports_disabled.cpp", "src/tools/dns_proxy_stream.cppm", "src/tools/dns_proxy_tls.cppm", "src/tools/dns_proxy_tls.cpp"] }
dns-https = { implies = ["dns-tls", "http2", "nexus.dns/https-query"], sources = ["src/tools/dns_proxy_https.cpp", "!src/tools/dns_proxy_https_disabled.cpp"] }
dns-quic = { implies = ["dns-tls", "quic-tls", "quic-shared-port", "packet-stream-socket", "nexus.dns/quic-query"], sources = ["src/tools/dns_proxy_quic.cpp", "!src/tools/dns_proxy_quic_disabled.cpp"] }
dns-quic-resumption = ["dns-quic", "quic-resumption", "nexus.dns/quic-query-resumption"]
dns-https3 = { implies = ["dns-https", "dns-quic", "nexus.dns/https3-query"], sources = ["src/tools/dns_https3.cpp", "!src/tools/dns_https3_disabled.cpp"] }
http-client = { implies = ["tls", "nexus.protocols/http1-tls-client"], sources = ["src/tools/rule_fetch.cpp", "src/tools/named_http_client.cppm", "src/tools/named_http_client.cpp", "src/tools/rule_fetch_response.cppm", "src/tools/rule_fetch_h2_disabled.cppm", "src/tools/rule_fetch_h3_disabled.cppm", "!src/tools/rule_fetch_disabled.cpp"] }
http-client-h2 = { implies = ["http-client", "http2"], sources = ["src/tools/rule_fetch_h2.cppm", "src/tools/rule_fetch_h2.cpp", "!src/tools/rule_fetch_h2_disabled.cppm"] }
http-client-h3 = { implies = ["http-client", "quic-tls", "quic-shared-port", "packet-stream-socket", "nexus.protocols/masque-client"], sources = ["src/tools/rule_fetch_h3.cppm", "src/tools/rule_fetch_h3.cpp", "!src/tools/rule_fetch_h3_disabled.cppm"] }
vless = { implies = ["tls", "nexus.proxy-runtime/vless"], defines = ["NEXUS_ENABLE_VLESS"] }
trojan = { implies = ["tls", "nexus.proxy-runtime/trojan"], defines = ["NEXUS_ENABLE_TROJAN"] }
anytls = { implies = ["tls", "nexus.proxy-runtime/anytls"], defines = ["NEXUS_ENABLE_ANYTLS"] }
wireguard-endpoint = { implies = ["wireguard"], sources = ["src/tools/endpoint.cpp", "src/tools/tailscale_endpoint.cppm", "src/tools/tailscale_endpoint_disabled.cpp"] }
wireguard-host-dns = { implies = ["wireguard-endpoint"], defines = ["NEXUS_ENDPOINT_HOST_DNS=1"] }
tun-host-dns = { implies = ["tun-inbound"], defines = ["NEXUS_TUN_HOST_DNS=1"], sources = ["src/tools/tun_resolved.cpp", "!src/tools/tun_resolved_disabled.cpp"] }
wireguard = ["crypto", "nexus.protocols/wireguard"]
tailscale = ["crypto", "nexus.protocols/tailscale"]
tailscale-control = ["tailscale", "tls", "http2", "nexus.protocols/tailscale-control"]
tailscale-policy = ["nexus.protocols/tailscale-policy"]
tailscale-map-projection = ["tailscale-control", "tailscale-policy", "nexus.protocols/tailscale-map-projection"]
tailscale-endpoint = { implies = ["wireguard-endpoint", "tailscale-map-projection", "nexus.protocols/tailscale-wireguard-tun"], sources = ["src/tools/tailscale_endpoint.cpp", "src/tools/tailscale_endpoint_config.cpp", "src/tools/tailscale_identity.cppm", "src/tools/tailscale_identity.cpp", "!src/tools/tailscale_endpoint_disabled.cpp"] }
tailscale-outbound = { implies = ["tailscale-endpoint", "nexus.proxy-runtime/mesh-outbound"], sources = ["src/tools/tailscale_outbound.cpp", "!src/tools/tailscale_outbound_disabled.cpp"] }
hysteria2-core = ["nexus.protocols/hysteria2-core"]
quic-crypto = ["crypto", "nexus.protocols/quic-crypto"]
quic-sniff = ["quic-crypto", "nexus.protocols/quic-sniff"]
quic-native = ["nexus.protocols/quic-native"]
quic-transport = ["crypto", "nexus.protocols/quic-transport"]
quic-tls = ["tls", "quic-transport", "nexus.protocols/quic-tls"]
quic-resumption = ["quic-tls", "tls-resumption", "nexus.protocols/quic-resumption"]
datagram-driver = ["nexus.protocols/datagram-driver"]
packet-stream-socket = ["nexus.protocols/packet-stream-socket"]
http3-core = ["nexus.protocols/http3-core"]
masque-core = ["nexus.protocols/masque-core"]
masque-session = ["masque-core", "http3-core", "quic-transport", "nexus.protocols/masque-session"]
masque-server = ["masque-session", "nexus.protocols/masque-server"]
masque-cli = { implies = ["masque-host"], defines = ["NEXUS_ENABLE_MASQUE"], sources = ["src/tools/masque_cli.cppm", "src/tools/masque_cli.cpp", "src/tools/masque_ip_server.cppm", "src/tools/masque_ip_server_disabled.cpp", "!src/tools/masque_cli_enabled_disabled.cppm"] }
masque-ip-server = { implies = ["masque-cli"], sources = ["src/tools/masque_ip_server.cpp", "!src/tools/masque_ip_server_disabled.cpp"] }
masque-host = { implies = ["masque-server", "quic-shared-port", "quic-tls", "nexus.protocols/hysteria2-support", "hysteria2-core", "nexus.protocols/quic-retry"], sources = ["src/masque/config.cppm", "src/masque/host.cppm", "src/masque/listener.cppm"] }
test-masque-listener-start = { implies = ["masque-host"], defines = ["NEXUS_TEST_MASQUE_LISTENER_START"] }
test-masque-host-lifetime = { implies = ["masque-host", "nexus.protocols/test-masque-host-lifetime"], defines = ["NEXUS_TEST_MASQUE_HOST_LIFETIME"] }
grpc = ["http2", "nexus.protocols/grpc"]
grpc-vless = { implies = ["grpc", "vless", "nexus.proxy-runtime/grpc-vless"], defines = ["NEXUS_ENABLE_GRPC_VLESS"] }
xhttp-vless = { implies = ["vless", "nexus.proxy-runtime/xhttp-vless"], defines = ["NEXUS_ENABLE_XHTTP_VLESS"] }
test-grpc-runtime = ["grpc-vless", "nexus.proxy-runtime/test-grpc-runtime"]
test-grpc-startup = ["grpc-vless", "nexus.proxy-runtime/test-grpc-startup"]
test-grpc-lifecycle = ["grpc-vless", "nexus.proxy-runtime/test-grpc-lifecycle"]
test-httpupgrade-fixture = []
test-http3-fixture = { implies = ["http3-core", "hysteria2-core", "quic-tls"], sources = ["tests/support/quic_tls_link.cppm", "tests/support/http3_link.cppm"] }
test-datagram-fixture = { implies = ["datagram-driver", "test-http3-fixture"], sources = ["tests/support/quic_datagram_link.cppm"] }
quic-retry = ["crypto", "nexus.protocols/quic-retry"]
hysteria2-listener = ["crypto", "nexus.protocols/hysteria2-listener"]
snell-core = ["crypto", "nexus.protocols/snell"]
snell = ["snell-core", "nexus.proxy-runtime/snell-outbound"]
hy2-client = ["crypto", "nexus.protocols/hysteria2-client", "nexus.proxy-runtime/hy2-outbound"]
test-hy2-production = { implies = ["test-hy2-retry-fixture", "hysteria2-listener"], sources = ["tests/support/hy2_production_resource_link.cppm", "tests/support/hy2_production_resource_link.cpp"] }
test-hy2-retry-fixture = { implies = ["test-hy2-fixture", "quic-retry"], sources = ["tests/support/hy2_retry_port_link.cppm"] }
test-hy2-retry-resource = { implies = ["test-hy2-retry-fixture"], sources = ["tests/support/hy2_retry_resource_link.cppm", "tests/support/hy2_retry_resource_link.cpp"] }
quic-shared-port = ["nexus.protocols/quic-shared-port"]
hysteria2-application = ["nexus.protocols/hysteria2-application"]
test-hy2-fixture = { implies = ["test-datagram-fixture", "hysteria2-application", "quic-shared-port"], sources = ["tests/support/hysteria2_application_link.cppm", "tests/support/hy2_port_link.cppm", "tests/support/hy2_native_memory.cppm"] }
test-hy2-resource = { implies = ["test-hy2-fixture"], sources = ["tests/support/hy2_resource_link.cppm", "tests/support/hy2_resource_link.cpp"] }

# HTTP/2 provides bounded sessions/channels; CLI transport integration is separate.
http2 = ["nexus.protocols/http2"]
http2-tls = ["http2", "nexus.protocols/http2-tls"]
hy2-cli = { implies = ["hy2-client", "hysteria2-listener", "nexus.proxy-runtime/hy2-inbound"], defines = ["NEXUS_ENABLE_HY2"], sources = ["src/tools/hy2_cli.cppm", "src/tools/hy2_cli.cpp", "!src/tools/hy2_cli_enabled_disabled.cppm"] }
dns-response = { implies = ["nexus.proxy-runtime/dns-response"], defines = ["NEXUS_DNS_RESPONSE"] }
dns-response-ss = { implies = ["dns-response", "ss2022", "nexus.ss-udp-runtime/dns-response", "nexus.dns-group-udp/dns-response"], defines = ["NEXUS_DNS_RESPONSE"] }
ss2022 = { implies = ["crypto", "nexus.protocols/ss2022", "nexus.proxy-runtime/ss2022"], sources = ["src/tools/udp_cli_enabled.cpp"] }
shadowtls = ["crypto", "nexus.protocols/shadowtls"]
shadowtls-proxy = { implies = ["tls", "nexus.protocols/shadowtls-runtime", "nexus.proxy-runtime/shadowtls"], defines = ["NEXUS_ENABLE_SHADOWTLS"] }
tuic-core = ["crypto", "tls", "nexus.protocols/tuic-core"]
tuic = { implies = ["tuic-core", "quic-tls", "quic-retry", "nexus.protocols/tuic", "nexus.proxy-runtime/tuic"], defines = ["NEXUS_ENABLE_TUIC"], sources = ["src/tools/tuic_cli.cppm", "src/tools/tuic_cli.cpp", "!src/tools/tuic_cli_enabled_disabled.cppm"] }
tun-inbound = { implies = ["nexus.platform/nftables"], defines = ["NEXUS_ENABLE_TUN"], sources = ["src/tools/tun_host.cppm", "src/tools/tun_host.cpp", "src/tools/tun_network_owner.cppm", "src/tools/tun_network_owner.cpp", "src/tools/tun_resolved.cppm", "src/tools/tun_resolved_disabled.cpp", "src/tools/tun_cli.cppm", "src/tools/tun_cli.cpp", "src/tools/masque_tun.cppm", "src/tools/masque_tun_disabled.cpp", "!src/tools/tun_cli_enabled_disabled.cppm"] }
masque-ip-endpoint = { implies = ["tun-inbound", "masque-outbound", "packet-stream-socket"], sources = ["src/tools/masque_tun.cpp", "src/tools/masque_tun_policy.cppm", "!src/tools/masque_tun_disabled.cpp"] }
masque-outbound = { implies = ["quic-tls", "quic-shared-port", "nexus.protocols/masque-client", "nexus.proxy-runtime/masque-outbound"], defines = ["NEXUS_ENABLE_MASQUE_OUTBOUND"] }
wireguard-outbound = { implies = ["wireguard", "nexus.proxy-runtime/wireguard"], defines = ["NEXUS_ENABLE_WIREGUARD"] }
ssh = { implies = ["crypto", "nexus.protocols/ssh", "nexus.proxy-runtime/ssh"], defines = ["NEXUS_ENABLE_SSH"] }
naive = { implies = ["tls", "http2", "quic-tls", "quic-retry", "quic-shared-port", "packet-stream-socket", "masque-server", "nexus.protocols/naive", "nexus.proxy-runtime/naive"], defines = ["NEXUS_ENABLE_NAIVE"] }
test-http-header-fixture = []
test-dns-resource = []
test-rules-bench = []
test-dns-reverse = ["nexus.dns/reverse"]
test-source-route = { implies = ["nexus.proxy-runtime/test-source-route"], defines = ["NEXUS_TEST_SOURCE_ROUTE"] }
memory-budget = ["nexus.protocols/memory-budget"]
acme = { implies = ["tls", "nexus.protocols/acme"], defines = ["NEXUS_ENABLE_ACME"] }
sni-demux = { implies = ["nexus.proxy-runtime/sni-demux"], defines = ["NEXUS_ENABLE_SNI_DEMUX"] }
dns-dhcp = ["nexus.dns/dhcp"]
dns-mdns = ["nexus.dns/mdns"]
derp-server = { implies = ["crypto", "nexus.protocols/derp-server"], defines = ["NEXUS_ENABLE_DERP_SERVER"] }
ssmapi = { sources = ["src/control_api/ssmapi.cppm", "src/control_api/ssmapi.cpp"], defines = ["NEXUS_ENABLE_SSMAPI"] }
openvpn = { implies = ["tls", "nexus.protocols/openvpn"], defines = ["NEXUS_ENABLE_OPENVPN"] }
openconnect = { implies = ["tls", "nexus.protocols/openconnect"], defines = ["NEXUS_ENABLE_OPENCONNECT"] }
reverse-tunnel = { implies = ["nexus.proxy-runtime/reverse-tunnel"], defines = ["NEXUS_ENABLE_REVERSE_TUNNEL"] }
bridge = { defines = ["NEXUS_ENABLE_BRIDGE"] }
tor = { implies = ["nexus.proxy-runtime/tor"], defines = ["NEXUS_ENABLE_TOR"] }

[feature-deps.wireguard-endpoint]
nexus.wireguard-endpoint = { path = "src/endpoint" }

[feature-deps.wireguard-host-dns]
nexus.wireguard-endpoint = { path = "src/endpoint", features = ["host-dns-resolved"] }

[feature-deps.io-uring]
nexus.uring-system = { path = "3rdparty/mcpp-uring" }

[feature-deps.crypto-primitives]
nexus.crypto = { path = "src/crypto" }

[feature-deps.ss2022]
nexus.ss-udp-runtime = { path = "src/udp-runtime" }
nexus.dns-group-udp = { path = "src/udp-shared", default-features = false }

[feature-deps.tun-inbound]
nexus.tun = { path = "src/transport", features = ["default-network"] }

[feature-deps.tun-host-dns]
nexus.wireguard-endpoint = { path = "src/endpoint", features = ["host-dns-resolved"] }

[feature-deps.masque-outbound]
nexus.tun = { path = "src/transport", default-features = false }

[feature-deps.masque-ip-server]
nexus.tun = { path = "src/transport", default-features = false, features = ["network"] }

[feature-deps.bridge]
nexus.tun = { path = "src/transport", default-features = false, features = ["bridge"] }

[build]
target_budget = "24GiB"
memory_threshold = "2GiB"
# Match the static-link interface of the original Capy/Corosio recipes.
defines = ["BOOST_CAPY_NO_LIB", "BOOST_CAPY_STATIC_LINK",
           "BOOST_COROSIO_NO_LIB", "BOOST_COROSIO_STATIC_LINK",
           "NEXUS_ENABLE_SOCKS_UDP"]
sources = [
    # Verify pinned network dependency snapshots before building the app.
    "src/build/mcpp_pinned_guard.cpp",
    "src/tools/logging.cppm", "src/tools/logging.cpp",
    "src/control_api/types.cppm", "src/control_api/openmetrics_disabled.cppm", "src/control_api/control_api_disabled.cppm",
    "src/tools/dns_transports.cppm", "src/tools/dns_transports_disabled.cpp", "src/tools/dns_fakeip_backend_disabled.cppm",
    "src/tools/control.cppm", "src/tools/selector_state.cpp", "src/tools/state_cli.cpp", "src/tools/dns_message_runtime.cppm", "src/tools/dns_message_runtime.cpp", "src/tools/dns_proxy_https.cppm", "src/tools/dns_proxy_https_disabled.cpp", "src/tools/dns_proxy_quic.cppm", "src/tools/dns_proxy_quic_disabled.cpp", "src/tools/dns_https3.cppm", "src/tools/dns_https3_disabled.cpp", "src/tools/endpoint.cppm", "src/tools/endpoint_disabled.cpp", "src/tools/hy2_cli_disabled.cppm", "src/tools/hy2_cli_enabled_disabled.cppm", "src/tools/masque_cli_disabled.cppm", "src/tools/masque_cli_enabled_disabled.cppm", "src/tools/tuic_cli_disabled.cppm", "src/tools/tuic_cli_enabled_disabled.cppm", "src/tools/tun_cli_disabled.cppm", "src/tools/tun_cli_enabled_disabled.cppm", "src/tools/udp_cli.cppm", "src/tools/tailscale_outbound.cppm", "src/tools/tailscale_outbound_disabled.cpp", "src/tools/proxy_ntp.cppm", "src/tools/proxy_ntp_disabled.cpp", "src/tools/proxy_run.cppm", "src/tools/route_files.cppm", "src/tools/route_files.cpp", "src/tools/outbound_config.cppm", "src/tools/outbound_config.cpp", "src/tools/proxy_server.cpp", "src/tools/rule_convert.cpp", "src/tools/rule_explain.cpp", "src/tools/rule_fetch_disabled.cpp",
]

[target.'cfg(not(os = "windows"))'.build]
sources = ["src/tools/control_posix.cpp", "!src/control_api/http_socket_windows.cpp"]

[target.'cfg(os = "windows")'.build]
sources = ["src/tools/control_windows.cpp", "!src/control_api/http_socket_posix.cpp"]

[targets.nexus-core]
kind = "lib"

[targets.tun-auto-redirect-unit]
kind = "bin"
main = "tests/tun_auto_redirect_unit.cpp"
required_features = ["tun-inbound"]

[targets.nexus-cli]
kind = "entry"
main = "src/tools/main.cpp"

[targets.nexus]
kind = "bin"
main = "src/tools/main.cpp"

[targets.routing-batch93a-unit]
