# The workspace is being organized by responsibility; only declared features
# and tests are available in the current build graph.
[workspace]
members = ["3rdparty/mcpp-corosio", "tests/dns-flight-copy", "src/endpoint", "tests/wireguard-endpoint", "tests/wireguard-reverse-fault", "src", "src/rules", "src/dns", "src/relay", "src/crypto", "src/containers", "src/functional", "src/utility", "src/encoding", "src/platform", "src/tun", "src/udp-runtime", "tests/protocol", "tests/dns", "tests/fakeip", "tests/http2", "tests/http2-client", "tests/tls", "tests/platform", "tests/deps", "tests/proxy-faults", "tests/proxy-preload", "tests/shims/proxy-start", "tests/shims/slow-resolver", "tests/shims/clock-fault", "tests/shims/dns-system-guard", "tests/shims/ss-udp-observe", "tests/tun", "tests/tun-faults", "tests/udp-faults", "tests/udp-runtime", "tests/udp-owner-faults", "tests/uot-client", "tests/chain-client", "src/dns-shared", "src/udp-shared"]

[workspace.package]
standard = "c++26"
mcpp = ">=2026.11.21.1"

[workspace.build]
# Stack protector mode must match between the shared std BMI and every workspace member.
dialect_cxxflags = ["-fstack-protector-strong"]

[workspace.dependencies]
nexus.glaze-kdl = "=0.1.1"
nexus.ngcpp-proxy = "=0.1.0"
nexus.blake3-source = "=1.8.7"
nexus.argon2-source = "=20190702-nexus.2"
nexus.nghttp2-source = "=1.71.0"
nexus.nghttp3-source = "=1.19.0-nexus.1"
uring-system = { path = "3rdparty/mcpp-uring" }
zlib-system = { path = "3rdparty/mcpp-zlib" }

[package]
name = "nexus"
version = "0.1.0"

[workspace.toolchain]
# Managed LLVM 23 toolchain bundles libc++, std.cppm, and static C++ runtime archives.
default = "llvm@23.1.6"

[workspace.target.x86_64-linux-gnu]
sysroot = "glibc@system"

[workspace.indices]
nexus = { path = "3rdparty/mcpp-index" }

[dependencies]
policy = { path = "src/rules" }
dns = { path = "src/dns" }
protocols = { path = "src", features = ["logging", "state"] }
relay-runtime = { path = "src/relay" }
containers = { path = "src/containers" }
functional = { path = "src/functional" }
utility = { path = "src/utility" }
encoding = { path = "src/encoding" }
platform = { path = "src/platform", features = ["network-state"] }
nexus.glaze-kdl = "=0.1.1"
nexus.ngcpp-proxy = "=0.1.0"

[features]
default = ["io-uring"]
# Named aggregate release profiles:
# - profile-embedded: slim cross-platform client core (iOS NE / OpenWrt / minimal static lib).
# - profile-sidecar: full cross-platform non-root client core (Android / macOS / Windows / desktop GUI).
# - profile-linux-epoll: full Linux epoll profile (adds server features, kTLS, TPROXY, host DNS, VPNs, services).
# - profile-linux-uring: full Linux io_uring flagship profile.
profile-embedded = [
    "http-connect-tls", "quic-sniff",
    "vless", "trojan", "ss2022", "anytls",
    "hy2-cli", "tuic", "wireguard-outbound",
    "tls-resumption", "quic-resumption",
    "dns-https", "dns-quic-resumption", "dns-fakeip", "dns-response-ss",
    "http-client-h2", "srs",
]
profile-sidecar = [
    "profile-embedded",
    "tls-certificate-compression", "dns-https3", "http-client-h3",
    "xhttp-vless", "grpc-vless", "masque-ip-endpoint",
    "snell", "shadowtls-proxy", "ssh", "naive",
    "control-http", "metrics-openmetrics", "ntp",
]
profile-linux-epoll = [
    "profile-sidecar", "masque-ip-server", "log-journald", "tun-host-dns", "wireguard-host-dns",
    "tproxy-udp", "ktls", "memory-budget", "acme", "derp-server", "sni-demux",
    "ssmapi", "reverse-tunnel", "bridge", "tor", "dns-dhcp", "dns-mdns",
    "openvpn", "openconnect",
]
profile-linux-uring = ["profile-linux-epoll", "io-uring"]
state-unit = []
state-fakeip-dns-unit = []
ruleset-cache-unit = []
routing-batch93a-unit = []
test-bins = []
logging = ["protocols/logging"]
log-journald = ["protocols/log-journald"]
ntp = { implies = ["protocols/ntp"], defines = ["NEXUS_ENABLE_NTP"], sources = ["src/tools/proxy_ntp_enabled.cpp", "!src/tools/proxy_ntp_disabled.cpp"] }
control-http = { implies = ["crypto"], defines = ["NEXUS_ENABLE_CONTROL_HTTP"], sources = ["src/control_api/http_socket.cppm", "src/control_api/http_socket_posix.cpp", "src/control_api/http_socket_windows.cpp", "src/control_api/http_format.cppm", "src/control_api/http_stream.cppm", "src/control_api/http_extra_routes.cppm", "src/control_api/dashboard_static.cppm", "src/control_api/http_ws.cppm", "src/control_api/http_server.cppm", "src/control_api/http_server.cpp", "!src/control_api/control_api_disabled.cppm"] }
metrics-openmetrics = { implies = ["control-http"], sources = ["src/control_api/openmetrics.cppm", "!src/control_api/openmetrics_disabled.cppm"] }
srs = ["policy/srs"]
tproxy-udp = ["relay-runtime/tproxy-udp"]
http-connect-tls = ["tls", "relay-runtime/http-connect-tls"]
io-uring = ["protocols/io-uring", "platform/io-uring"]
# Crypto can also be selected without the VLESS transport.
crypto = ["crypto-primitives"]
crypto-primitives = []
tls = { implies = ["crypto", "protocols/tls"], defines = ["NEXUS_ENABLE_TLS"], sources = ["src/tools/cert_reloader.cppm", "!src/tools/cert_reloader_disabled.cppm"] }
tls-resumption = ["tls", "protocols/tls-resumption"]
tls-certificate-compression = ["tls", "protocols/tls-certificate-compression"]
ktls = { implies = ["tls", "protocols/ktls"], defines = ["NEXUS_ENABLE_KTLS"] }
dns-fakeip = { implies = ["dns/fakeip-history", "relay-runtime/fakeip"], defines = ["NEXUS_ENABLE_FAKEIP"], sources = ["src/tools/dns_fakeip_backend.cppm", "!src/tools/dns_fakeip_backend_disabled.cppm"] }
dns-tls = { implies = ["tls", "dns/tls-query"], sources = ["src/tools/dns_transports.cpp", "src/tools/dns_extra_transports.cpp", "!src/tools/dns_transports_disabled.cpp", "src/tools/dns_proxy_stream.cppm", "src/tools/dns_proxy_tls.cppm", "src/tools/dns_proxy_tls.cpp"] }
dns-https = { implies = ["dns-tls", "http2", "dns/https-query"], sources = ["src/tools/dns_proxy_https.cpp", "!src/tools/dns_proxy_https_disabled.cpp"] }
dns-quic = { implies = ["dns-tls", "quic-tls", "quic-shared-port", "packet-stream-socket", "dns/quic-query"], sources = ["src/tools/dns_proxy_quic.cpp", "!src/tools/dns_proxy_quic_disabled.cpp"] }
dns-quic-resumption = ["dns-quic", "quic-resumption", "dns/quic-query-resumption"]
dns-https3 = { implies = ["dns-https", "dns-quic", "dns/https3-query"], sources = ["src/tools/dns_https3.cpp", "!src/tools/dns_https3_disabled.cpp"] }
http-client = { implies = ["tls", "protocols/http1-tls-client"], sources = ["src/tools/rule_fetch_url.cppm", "src/tools/rule_fetch_alternative.cppm", "src/tools/rule_fetch_response.cppm", "src/tools/rule_fetch_h2_disabled.cppm", "src/tools/rule_fetch_h3_disabled.cppm", "src/tools/rule_fetch_connection.cppm", "src/tools/named_http1_pool.cppm", "src/tools/named_http_client.cppm", "src/tools/named_http_client.cpp", "src/tools/rule_watch_client.cppm", "src/tools/rule_fetch_cache.cppm", "src/tools/rule_fetch.cpp", "!src/tools/rule_fetch_disabled.cpp", "src/tools/tools_fetch_types.cppm", "src/tools/tools_fetch_h2_disabled.cppm", "src/tools/tools_fetch_h3_disabled.cppm", "src/tools/tools_fetch.cpp", "!src/tools/tools_fetch_disabled.cpp"] }
http-client-h2 = { implies = ["http-client", "http2"], sources = ["src/tools/rule_fetch_h2.cppm", "src/tools/rule_fetch_h2.cpp", "!src/tools/rule_fetch_h2_disabled.cppm", "src/tools/tools_fetch_h2.cppm", "!src/tools/tools_fetch_h2_disabled.cppm"] }
http-client-h3 = { implies = ["http-client", "quic-tls", "quic-shared-port", "packet-stream-socket", "protocols/masque-client"], sources = ["src/tools/rule_fetch_h3.cppm", "src/tools/rule_fetch_h3.cpp", "!src/tools/rule_fetch_h3_disabled.cppm", "src/tools/tools_fetch_h3.cppm", "!src/tools/tools_fetch_h3_disabled.cppm"] }
vless = { implies = ["tls", "relay-runtime/vless"], defines = ["NEXUS_ENABLE_VLESS"] }
trojan = { implies = ["tls", "relay-runtime/trojan"], defines = ["NEXUS_ENABLE_TROJAN"] }
anytls = { implies = ["tls", "relay-runtime/anytls"], defines = ["NEXUS_ENABLE_ANYTLS"] }
wireguard-endpoint = { implies = ["wireguard"], sources = ["src/tools/endpoint.cpp", "src/tools/tailscale_endpoint.cppm", "src/tools/tailscale_endpoint_disabled.cpp"] }
wireguard-host-dns = { implies = ["wireguard-endpoint"], defines = ["NEXUS_ENDPOINT_HOST_DNS=1"] }
tun-host-dns = { implies = ["tun-inbound"], defines = ["NEXUS_TUN_HOST_DNS=1"], sources = ["src/tools/tun_resolved.cpp", "!src/tools/tun_resolved_disabled.cpp"] }
wireguard = ["crypto", "protocols/wireguard"]
tailscale = ["crypto", "protocols/tailscale"]
tailscale-control = ["tailscale", "tls", "http2", "protocols/tailscale-control"]
tailscale-policy = ["protocols/tailscale-policy"]
tailscale-map-projection = ["tailscale-control", "tailscale-policy", "protocols/tailscale-map-projection"]
tailscale-endpoint = { implies = ["wireguard-endpoint", "tailscale-map-projection", "protocols/tailscale-wireguard-tun"], sources = ["src/tools/tailscale_mesh_link.cppm", "src/tools/tailscale_endpoint.cpp", "src/tools/tailscale_endpoint_config.cpp", "src/tools/tailscale_identity.cppm", "src/tools/tailscale_identity.cpp", "!src/tools/tailscale_endpoint_disabled.cpp"] }
tailscale-outbound = { implies = ["tailscale-endpoint", "relay-runtime/mesh-outbound"], sources = ["src/tools/tailscale_outbound.cpp", "!src/tools/tailscale_outbound_disabled.cpp"] }
hysteria2-core = ["protocols/hysteria2-core"]
quic-crypto = ["crypto", "protocols/quic-crypto"]
quic-sniff = ["quic-crypto", "protocols/quic-sniff"]
quic-native = ["protocols/quic-native"]
quic-transport = ["crypto", "protocols/quic-transport"]
quic-tls = ["tls", "quic-transport", "protocols/quic-tls"]
quic-resumption = ["quic-tls", "tls-resumption", "protocols/quic-resumption"]
datagram-driver = ["protocols/datagram-driver"]
