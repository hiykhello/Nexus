tun-inbound = { implies = ["platform/nftables"], defines = ["NEXUS_ENABLE_TUN"], sources = ["src/tools/tun_udp_fragments.cppm", "src/tools/tun_udp_reply_fragments.cppm", "src/tools/tun_owner_lookup.cppm", "src/tools/tun_tcp_dns.cppm", "src/tools/tun_tcp.cppm", "src/tools/tun_fakeip.cppm", "src/tools/tun_udp_proxy.cppm", "src/tools/tun_udp.cppm", "src/tools/tun_device_runtime.cppm", "src/tools/tun_event_wait.cppm", "src/tools/tun_host.cppm", "src/tools/tun_host.cpp", "src/tools/tun_network_owner.cppm", "src/tools/tun_network_owner.cpp", "src/tools/tun_resolved.cppm", "src/tools/tun_resolved_disabled.cpp", "src/tools/tun_cli.cppm", "src/tools/tun_cli.cpp", "src/tools/masque_tun.cppm", "src/tools/masque_tun_disabled.cpp", "!src/tools/tun_cli_enabled_disabled.cppm"] }
