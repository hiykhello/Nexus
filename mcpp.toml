ss2022 = { implies = ["crypto", "protocols/ss2022", "relay-runtime/ss2022"], sources = ["src/tools/udp_cli_enabled.cppm", "src/tools/udp_cli_runtime.cpp", "src/tools/udp_cli_enabled.cpp"] }
