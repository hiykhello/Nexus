[feature-deps.wireguard-endpoint]
wireguard-endpoint = { path = "src/endpoint" }

[feature-deps.wireguard-host-dns]
wireguard-endpoint = { path = "src/endpoint", features = ["host-dns-resolved"] }

[feature-deps.crypto-primitives]
crypto = { path = "src/crypto" }

[feature-deps.ss2022]
ss-udp-runtime = { path = "src/udp-runtime" }
dns-group-udp = { path = "src/udp-shared", default-features = false }

[feature-deps.tun-inbound]
tun = { path = "src/tun", features = ["default-network"] }

[feature-deps.tun-host-dns]
