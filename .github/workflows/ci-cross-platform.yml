name: Nexus Cross-Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repo Audits (Lock, Pins, Lines, Style)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep && rg --version
      - name: Verify default epoll lock and corosio patch SHA-256
        run: |
          EXPECTED_LOCK="5da3ae56d02ac0811654c4123958477182ea78d7652d74d82687c7cc92b18b5b"
          ACTUAL_LOCK="$(sha256sum mcpp/epoll/mcpp.lock | awk '{print $1}')"
          test "$ACTUAL_LOCK" = "$EXPECTED_LOCK"
          EXPECTED_PATCH="4a0fa002754df7c8251305ee9fc43f7423dbd2f54a2829ea50b88cd5beb76277"
          ACTUAL_PATCH="$(sha256sum 3rdparty/patches/corosio/mcpp-exact.patch | awk '{print $1}')"
          test "$ACTUAL_PATCH" = "$EXPECTED_PATCH"
      - name: Line limits & hygiene audit
        run: |
          ./scripts/check-source-lines.sh
          python3 tests/mcpp_pinned_deps.py --manifest-only
          git diff --check
          forbid_rg() {
            local rc=0
            rg "$@" || rc=$?
            if [[ "$rc" -eq 1 ]]; then
              return 0
            elif [[ "$rc" -eq 0 ]]; then
              echo "FAIL: forbidden pattern matched: rg $*" >&2
              return 1
            else
              echo "FAIL: rg errored (exit $rc): rg $*" >&2
              return "$rc"
            fi
          }
          forbid_rg -n '^export module (nexus|thirdparty)\.' src/ 3rdparty/modules/ tests/
          forbid_rg -n 'import (nexus|thirdparty)\.' src/ 3rdparty/modules/ tests/ experiments/ --glob '!*.patch'
          forbid_rg -n '\bnex::|namespace nex\b|nexus_(ngtcp2|nghttp3|boringssl)_abi' src/ 3rdparty/modules/ tests/ scripts/
          forbid_rg -n 'nexus\.compat|compat_callable' src/ 3rdparty/modules/ tests/ mcpp/ scripts/ mcpp.toml
          forbid_rg -n '/home/yk|file:///' docs/ README.md packaging/ android/ apple/ desktop/ web/src/ web/README.md
          forbid_rg -ni 'sing-box|mihomo|clash|v2ray|xray' docs/ README.md packaging/ android/ apple/ desktop/ web/src/ web/README.md

  web-dashboard:
    name: Web Dashboard (Lit + Vite 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"
      - name: Install, type-check & build Web Dashboard
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web exec tsc --noEmit && pnpm --dir web build
      - uses: actions/upload-artifact@v7
        with:
          name: nexus-web-dist
          path: web/dist

  android-apk:
    name: Android APK & Unit Tests (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Run Android unit tests & assemble debug APK
        working-directory: android
        run: gradle :core-bridge:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nexus-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload Android unit test reports on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nexus-android-test-reports
          path: |
            android/**/build/test-results/
            android/**/build/reports/tests/
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop C++26 Bridge (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure & test Desktop C++26 Bridge (MSVC + CMake)
        shell: cmd
        run: |
          set "VSWHERE_DIR=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer"
          if not exist "%VSWHERE_DIR%\vswhere.exe" (
            echo ERROR: vswhere.exe not found in "%VSWHERE_DIR%" >&2
            exit /b 1
          )
          set "PATH=%VSWHERE_DIR%;%PATH%"
          for /f "usebackq delims=" %%i in (`vswhere.exe -latest -prerelease -products * -find VC\Auxiliary\Build\vcvarsall.bat`) do set "VCVARS=%%i"
          if not defined VCVARS (
            echo ERROR: vcvarsall.bat not found via vswhere.exe >&2
            exit /b 1
          )
          echo Using MSVC environment: %VCVARS%
          call "%VCVARS%" x64 || exit /b 1
          cmake -S desktop -B target/desktop-win -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release -DNEXUS_DESKTOP_BUILD_UI=OFF -DNEXUS_DESKTOP_BUILD_TESTS=ON || exit /b 1
          cmake --build target/desktop-win --parallel || exit /b 1
          ctest --test-dir target/desktop-win --output-on-failure || exit /b 1

  apple-swift6:
    name: Apple Swift 6 Package & Tests (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build & test NexusCoreBridge (Swift 6 strict concurrency)
        working-directory: apple
        run: |
          swift --version
          swift test --parallel
          swift build -c release
      - name: Validate Apple XCFramework packaging plan & optional C++26 kernel build
        run: |
          bash scripts/build-apple-xcframework.sh --dry-run
          if command -v mcpp >/dev/null 2>&1; then
            (cd mcpp/darwin-arm64 && mcpp --offline --locked build --strict)
            (cd mcpp/ios-arm64 && mcpp --offline --locked build --strict)
          else
            echo "mcpp not preinstalled on runner; skipping native Apple C++26 core compile"
          fi

  arch-pkg:
    name: Arch Linux Package (x86_64 io_uring)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies & create builder user
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git patch pkgconf curl ca-certificates tar xz \
            binutils liburing zlib brotli zstd python
          id -u builder >/dev/null 2>&1 || useradd -m builder
          git config --system --add safe.directory '*'
      - uses: actions/checkout@v7
      - name: Install pinned mcpp v2026.11.24.1
        run: |
          MCPP_VER="2026.11.24.1"
          MCPP_SHA256="fb4ef3b15cf99f284d6362d5232b13f633fa1aedbf99858f8592af28541b81ee"
          MCPP_URL="https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VER}/mcpp-${MCPP_VER}-linux-x86_64.tar.gz"
          TMP_TGZ="/tmp/mcpp-${MCPP_VER}.tar.gz"
          curl -fsSL -o "$TMP_TGZ" "$MCPP_URL"
          echo "${MCPP_SHA256}  ${TMP_TGZ}" | sha256sum -c -
          rm -rf /opt/mcpp
          mkdir -p /opt/mcpp
          tar -xzf "$TMP_TGZ" --strip-components=1 -C /opt/mcpp
          rm -f "$TMP_TGZ"
          cat <<'EOF' > /usr/bin/mcpp
          #!/bin/sh
          set -eu
          MCPP_OPT="/opt/mcpp"
          export MCPP_HOME="${MCPP_HOME:-$HOME/.mcpp}"
          export MCPP_VENDORED_XLINGS="${MCPP_VENDORED_XLINGS:-$MCPP_OPT/registry/bin/xlings}"
          exec "$MCPP_OPT/bin/mcpp" "$@"
          EOF
          chmod 0755 /usr/bin/mcpp
          su - builder -c 'mcpp --version'
      - name: Cache mcpp toolchain & upstream archives
        uses: actions/cache@v6
        with:
          path: |
            /home/builder/.mcpp/registry
            /home/builder/.mcpp/cache
            /home/builder/.mcpp/indices
          key: arch-mcpp-v2026.11.24.1-${{ hashFiles('mcpp.lock', '3rdparty/mcpp-pins.json') }}
          restore-keys: |
            arch-mcpp-v2026.11.24.1-
      - name: Build io_uring binary & package Arch .pkg.tar.zst as builder
        run: |
          rm -rf /tmp/nexus-arch-src /tmp/nexus-arch-pkg /tmp/nexus-arch-out "$GITHUB_WORKSPACE/dist-arch"
          mkdir -p /home/builder/.mcpp /tmp/nexus-arch-src /tmp/nexus-arch-pkg /tmp/nexus-arch-out "$GITHUB_WORKSPACE/dist-arch"
          tar -C "$GITHUB_WORKSPACE" --exclude='./dist-arch' -cf - . | tar -C /tmp/nexus-arch-src -xf -
          cp /tmp/nexus-arch-src/packaging/arch/PKGBUILD /tmp/nexus-arch-pkg/PKGBUILD
          chown -R builder:builder /home/builder/.mcpp /tmp/nexus-arch-src /tmp/nexus-arch-pkg /tmp/nexus-arch-out
          su - builder -c '
            set -euo pipefail
            export NEXUS_SRC_DIR=/tmp/nexus-arch-src
            export NEXUS_FEATURES=profile-linux-uring
            export PKGDEST=/tmp/nexus-arch-out
            export PKGEXT=.pkg.tar.zst
            cd /tmp/nexus-arch-pkg
            makepkg -f --noconfirm
          '
          cp /tmp/nexus-arch-out/*.pkg.tar.zst "$GITHUB_WORKSPACE/dist-arch/"
          (cd "$GITHUB_WORKSPACE/dist-arch" && sha256sum *.pkg.tar.zst > SHA256SUMS)
          ls -la "$GITHUB_WORKSPACE/dist-arch"
          cat "$GITHUB_WORKSPACE/dist-arch/SHA256SUMS"
      - name: Inspect & smoke-test Arch package installation
        run: |
          PKG_FILE="$(ls "$GITHUB_WORKSPACE"/dist-arch/nexus-*.pkg.tar.zst | head -n 1)"
          test -f "$PKG_FILE"
          pacman -Qip "$PKG_FILE"
          pacman -Qlp "$PKG_FILE"
          pacman -U --noconfirm "$PKG_FILE"
          /usr/bin/nexus --help | grep -q 'usage: nexus'
          ldd /usr/bin/nexus | grep -q 'liburing\.so\.2'
          test -f /usr/lib/systemd/system/nexus.service
          test -f /usr/lib/systemd/system/nexus@.service
          test -f /usr/include/nexus/core_c_api.h
          test -f /usr/share/bash-completion/completions/nexus
          test -f /usr/share/zsh/site-functions/_nexus
          test -f /usr/share/fish/vendor_completions.d/nexus.fish
      - name: Upload Arch Linux x86_64 package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexus-arch-x86_64-pkg
          path: |
            dist-arch/*.pkg.tar.zst
            dist-arch/SHA256SUMS

  linux-musl-static:
    name: Linux Static Binary (x86_64 musl + mimalloc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned mcpp v2026.11.24.1
        run: |
          MCPP_VER="2026.11.24.1"
          MCPP_SHA256="fb4ef3b15cf99f284d6362d5232b13f633fa1aedbf99858f8592af28541b81ee"
          MCPP_URL="https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VER}/mcpp-${MCPP_VER}-linux-x86_64.tar.gz"
          TMP_TGZ="/tmp/mcpp-${MCPP_VER}.tar.gz"
          curl -fsSL -o "$TMP_TGZ" "$MCPP_URL"
          echo "${MCPP_SHA256}  ${TMP_TGZ}" | sha256sum -c -
          sudo rm -rf /opt/mcpp
          sudo mkdir -p /opt/mcpp
          sudo tar -xzf "$TMP_TGZ" --strip-components=1 -C /opt/mcpp
          rm -f "$TMP_TGZ"
          sudo tee /usr/local/bin/mcpp >/dev/null <<'EOF'
          #!/bin/sh
          set -eu
          MCPP_OPT="/opt/mcpp"
          export MCPP_HOME="${MCPP_HOME:-$HOME/.mcpp}"
          export MCPP_VENDORED_XLINGS="${MCPP_VENDORED_XLINGS:-$MCPP_OPT/registry/bin/xlings}"
          exec "$MCPP_OPT/bin/mcpp" "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/mcpp
          mcpp --version
      - name: Cache mcpp toolchain & upstream archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.mcpp/registry
            ~/.mcpp/cache
            ~/.mcpp/indices
            ~/.mcpp/musl-xpkgs
          key: musl-mcpp-v2026.11.24.1-${{ hashFiles('mcpp.lock', 'mcpp/linux-musl-mimalloc/mcpp.lock', '3rdparty/mcpp-pins.json', 'mcpp/linux-musl-mimalloc/mcpp.toml') }}
          restore-keys: |
            musl-mcpp-v2026.11.24.1-
      - name: Build & verify 100% static musl + mimalloc binary
        run: |
          mkdir -p dist-musl
          bash scripts/build-linux-musl-mimalloc.sh \
            --engine docker \
            --arch x86_64 \
            --profile release \
            --out dist-musl/nexus
          (cd dist-musl && sha256sum nexus > SHA256SUMS)
          ls -lh dist-musl/nexus
          cat dist-musl/SHA256SUMS
      - name: Upload Linux x86_64 static musl + mimalloc artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexus-linux-x86_64-musl-mimalloc
          path: |
            dist-musl/nexus
            dist-musl/SHA256SUMS
