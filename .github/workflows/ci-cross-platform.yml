name: Nexus Cross-Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repo Audits (Lock, Pins, Lines, Style)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep && rg --version
      - name: Verify default epoll lock and corosio patch SHA-256
        run: |
          EXPECTED_LOCK="d98595bd120b31c66d05df7c1880728158a25cba478826c4b44654ebf793dc9f"
          ACTUAL_LOCK="$(sha256sum mcpp/epoll/mcpp.lock | awk '{print $1}')"
          test "$ACTUAL_LOCK" = "$EXPECTED_LOCK"
          EXPECTED_PATCH="b71384c36fadd705202dc82ac5b925e1b9fbae37ef7fe0d48ecc68181f03da94"
          ACTUAL_PATCH="$(sha256sum 3rdparty/patches/corosio/mcpp-exact.patch | awk '{print $1}')"
          test "$ACTUAL_PATCH" = "$EXPECTED_PATCH"
      - name: Line limits & hygiene audit
        run: |
          ./scripts/check-source-lines.sh
          python3 tests/mcpp_pinned_deps.py --manifest-only
          git diff --check
          forbid_rg() {
            local rc=0
            rg "$@" || rc=$?
            if [[ "$rc" -eq 1 ]]; then
              return 0
            elif [[ "$rc" -eq 0 ]]; then
              echo "FAIL: forbidden pattern matched: rg $*" >&2
              return 1
            else
              echo "FAIL: rg errored (exit $rc): rg $*" >&2
              return "$rc"
            fi
          }
          forbid_rg -n '^export module (nexus|thirdparty)\.' src/ 3rdparty/modules/ tests/
          forbid_rg -n 'import (nexus|thirdparty)\.' src/ 3rdparty/modules/ tests/ experiments/ --glob '!*.patch'
          forbid_rg -n '\bnex::|namespace nex\b|nexus_(ngtcp2|nghttp3|boringssl)_abi' src/ 3rdparty/modules/ tests/ scripts/
          forbid_rg -n 'nexus\.compat|compat_callable' src/ 3rdparty/modules/ tests/ mcpp/ scripts/ mcpp.toml
          forbid_rg -n '/home/yk|file:///' docs/ README.md packaging/ android/ apple/ desktop/ web/src/ web/README.md
          forbid_rg -ni 'sing-box|mihomo|clash|v2ray|xray' docs/ README.md packaging/ android/ apple/ desktop/ web/src/ web/README.md

  web-dashboard:
    name: Web Dashboard (Lit + Vite 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"
      - name: Install, type-check & build Web Dashboard
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web exec tsc --noEmit && pnpm --dir web build
      - uses: actions/upload-artifact@v7
        with:
          name: nexus-web-dist
          path: web/dist

  android-apk:
    name: Android APK & Unit Tests (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Run Android unit tests & assemble debug APK
        working-directory: android
        run: gradle :core-bridge:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nexus-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload Android unit test reports on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nexus-android-test-reports
          path: |
            android/**/build/test-results/
            android/**/build/reports/tests/
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop C++26 Bridge (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure & test Desktop C++26 Bridge (MSVC + CMake)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found at $vswhere"
            exit 1
          }
          $vsPath = (& $vswhere -latest -prerelease -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsPath)) {
            Write-Error 'Visual Studio with VC x86/x64 tools not found'
            exit 1
          }
          $vsPath = $vsPath.Trim()
          $devShell = Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          if (-not (Test-Path $devShell)) {
            Write-Error "Microsoft.VisualStudio.DevShell.dll not found at $devShell"
            exit 1
          }
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -S desktop -B target/desktop-win -G Ninja `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DNEXUS_DESKTOP_BUILD_UI=OFF `
            -DNEXUS_DESKTOP_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build target/desktop-win --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir target/desktop-win --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  apple-swift6:
    name: Apple Swift 6 Package & Tests (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build & test NexusCoreBridge (Swift 6 strict concurrency)
        working-directory: apple
        run: |
          swift --version
          swift test --parallel
          swift build -c release
      - name: Validate Apple XCFramework packaging plan & optional C++26 kernel build
        run: |
          bash scripts/build-apple-xcframework.sh --dry-run
          if command -v mcpp >/dev/null 2>&1; then
            (cd mcpp/darwin-arm64 && mcpp --offline --locked build --strict)
            (cd mcpp/ios-arm64 && mcpp --offline --locked build --strict)
          else
            echo "mcpp not preinstalled on runner; skipping native Apple C++26 core compile"
          fi
