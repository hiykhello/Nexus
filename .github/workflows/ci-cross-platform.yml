name: Nexus Cross-Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repo Audits (Lock, Pins, Lines, Style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify default epoll lock and corosio patch SHA-256
        run: |
          EXPECTED_LOCK="91580f265b74fafc8fe626e128401535fc0a61e8a70757f3264b2e14757d06ac"
          ACTUAL_LOCK="$(sha256sum mcpp/epoll/mcpp.lock | awk '{print $1}')"
          test "$ACTUAL_LOCK" = "$EXPECTED_LOCK"
          EXPECTED_PATCH="b71384c36fadd705202dc82ac5b925e1b9fbae37ef7fe0d48ecc68181f03da94"
          ACTUAL_PATCH="$(sha256sum 3rdparty/patches/corosio/mcpp-exact.patch | awk '{print $1}')"
          test "$ACTUAL_PATCH" = "$EXPECTED_PATCH"
      - name: Pinned dependency guard, line limits & hygiene audit
        run: |
          python3 scripts/mcpp-generate-pinned-guard.py --check --guard-only
          ./scripts/check-source-lines.sh
          git diff --check
          ! rg -n '/home/yk|file:///' docs/ src/ scripts/ packaging/ android/ apple/ desktop/ web/src/

  web-dashboard:
    name: Web Dashboard (Lit + Vite 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"
      - name: Install & build Web Dashboard
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build
      - uses: actions/upload-artifact@v7
        with:
          name: nexus-web-dist
          path: web/dist

  android-apk:
    name: Android APK & Unit Tests (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Run Android :core-bridge unit tests & assemble debug APK
        working-directory: android
        run: gradle :core-bridge:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nexus-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop C++26 Bridge (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure & test Desktop C++26 Bridge (MSVC + CMake)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S desktop -B target/desktop-win -G Ninja `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DNEXUS_DESKTOP_BUILD_UI=OFF `
            -DNEXUS_DESKTOP_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build target/desktop-win --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir target/desktop-win --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  apple-swift6:
    name: Apple Swift 6 Package & Tests (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build & test NexusCoreBridge (Swift 6 strict concurrency)
        working-directory: apple
        run: |
          swift --version
          swift test --parallel
          swift build -c release
