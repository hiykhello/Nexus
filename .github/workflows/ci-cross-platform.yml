name: Nexus Cross-Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repo Audits (Lock, Pins, Lines, Style)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify default epoll lock SHA-256
        run: |
          EXPECTED="91580f265b74fafc8fe626e128401535fc0a61e8a70757f3264b2e14757d06ac"
          ACTUAL="$(sha256sum mcpp/epoll/mcpp.lock | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
      - name: Pinned dependency guard & source line audit
        run: |
          python3 scripts/mcpp-generate-pinned-guard.py --check
          ./scripts/check-source-lines.sh
          git diff --check

  android-apk:
    name: Android APK & Unit Tests (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Run Android :core-bridge unit tests & assemble debug APK
        working-directory: android
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :core-bridge:testDebugUnitTest :app:assembleDebug --no-daemon
          else
            gradle :core-bridge:testDebugUnitTest :app:assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nexus-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop C++26 Bridge (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & test Desktop C++26 Bridge (MSVC + CMake)
        shell: pwsh
        run: |
          cmake -S desktop -B target/desktop-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DNEXUS_DESKTOP_BUILD_UI=OFF `
            -DNEXUS_DESKTOP_BUILD_TESTS=ON
          cmake --build target/desktop-win --parallel
          ctest --test-dir target/desktop-win --output-on-failure

  apple-swift6:
    name: Apple Swift 6 Package & Tests (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build & test NexusCoreBridge (Swift 6 strict concurrency)
        working-directory: apple
        run: |
          swift --version
          swift test --parallel
          swift build -c release
