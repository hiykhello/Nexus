# mcpp's root default features cannot be switched off on the command line.
# This application consumes the same Nexus package without its io-uring
# default and reuses the package's CLI entry point.
[package]
name = "nexus-epoll"
version = "0.1.0"
standard = "c++26"
mcpp = ">=2026.11.21.1"

[toolchain]
default = "llvm@23.1.6"

[target.x86_64-linux-gnu]
sysroot = "glibc@system"

[indices]
nexus = { path = "../../3rdparty/mcpp-index" }

[dependencies]
nexus = { path = "../..", default-features = false }

[build]
dialect_cxxflags = ["-fstack-protector-strong"]
sources = []

[target.'cfg(os = "linux")'.build]
cxxflags = ["-fmerge-all-constants"]
ldflags = ["-Wl,-z,noexecstack", "-Wl,-z,relro,-z,now", "-Wl,--as-needed", "-Wl,--gc-sections", "-Wl,--icf=safe"]

[profile.release]
opt = "z"
lto = true
strip = true

[profile.size]
opt = "z"
lto = true
strip = true

[profile.speed]
opt = 3
lto = true
strip = true

[targets.nexus]
kind = "bin"
main = { from = "nexus/nexus-cli" }
