# Windows x86-64 (MSVC / IOCP) desktop sidecar profile.
# Selects the cross-platform aggregate feature `profile-sidecar`.
[package]
name = "nexus-windows-x64"
version = "0.1.0"
standard = "c++26"
mcpp = ">=2026.11.21.1"

[toolchain]
default = "llvm@23.1.6"

[target.x86_64-windows-msvc]
sysroot = "msvc@system"

[indices]
nexus = { path = "../../3rdparty/mcpp-index" }

[dependencies]
nexus = { path = "../..", default-features = false, features = ["profile-sidecar"] }

[build]
sources = []

[profile.release]
opt = "z"
lto = true
strip = true

[profile.size]
opt = "z"
lto = true
strip = true

[profile.speed]
opt = 3
lto = true
strip = true

[targets.nexus-core-windows]
kind = "lib"

[targets.nexus]
kind = "bin"
main = { from = "nexus/nexus-cli" }
