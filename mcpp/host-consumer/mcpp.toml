[package]
name = "nexus-host-consumer"
version = "0.1.0"
standard = "c++26"
mcpp = ">=2026.11.21.1"

[toolchain]
default = "llvm@23.1.3"

[target.x86_64-linux-gnu]
sysroot = "glibc@system"

[indices]
nexus = { path = "../../3rdparty/mcpp-index" }

[dependencies]
nexus = { path = "../..", default-features = false, features = ["tun-inbound"] }

[build]
sources = []

[targets.host-consumer]
kind = "bin"
main = "../../tests/proxy_host_embedding.cpp"
