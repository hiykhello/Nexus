# Android ARM64 (aarch64-linux-musl) non-root sidecar profile.
# Locks epoll (Android 12-15 untrusted_app seccomp blocks io_uring_setup) and
# selects the cross-platform aggregate feature `profile-sidecar`.
[package]
name = "nexus-android-arm64"
version = "0.1.0"
standard = "c++26"
mcpp = ">=2026.11.21.1"

[target.aarch64-linux-musl]
sysroot = "musl@system"

[indices]
nexus = { path = "../../3rdparty/mcpp-index" }

[dependencies]
nexus = { path = "../..", default-features = false, features = ["profile-sidecar"] }

[build]
sources = []

[targets.nexus]
kind = "bin"
main = { from = "nexus/nexus-cli" }
